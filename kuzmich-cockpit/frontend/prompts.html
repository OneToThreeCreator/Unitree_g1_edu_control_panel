<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Редактор системных промтов</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/prompts.css">
</head>
<body>
<header>
  <h1>🧠 Редактор системных промтов</h1>
  <span id="batt" class="badge batt">⚡ --%</span>
  <div class="spacer"></div>
  <a href="/" class="back-btn header-link-back">← На главную</a>
</header>
<main>
  <!-- Prompt list (sidebar on desktop, fullscreen on mobile) -->
  <div class="sidebar" id="sidebar">
    <h2>Доступные промты</h2>
    <div id="promptList"></div>
    <div id="status" class="status hidden"></div>
    <div class="footnote">Активный промт отмечен ●</div>
  </div>

  <!-- Editor (fullscreen on mobile) -->
  <div class="editor" id="editorPanel">
    <div class="top">
      <button class="back-btn" id="backToList">← Назад</button>
      <div class="name-wrap">
        <label for="promptName">Имя:</label>
        <input id="promptName" placeholder="введите имя файла" />
        <span id="dirtyIndicator" class="indicator"></span>
      </div>
    </div>
    <textarea id="contentArea" placeholder="Содержимое системного промта…" spellcheck="false"></textarea>
    <div class="actions">
      <button class="primary" id="createBtn">➕ Создать новый</button>
      <button class="primary" id="saveBtn">💾 Сохранить</button>
      <button id="resetBtn">↺ Сбросить</button>
      <button class="danger" id="deleteBtn">🗑 Удалить</button>
      <button id="selectBtn">⭐ Активным</button>
    </div>
  </div>
</main>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a href="/">
    <span class="nav-icon">🎮</span>
    <span class="nav-label">Управление</span>
  </a>
  <a href="/features.html">
    <span class="nav-icon">🤖</span>
    <span class="nav-label">Функции</span>
  </a>
  <a href="/files.html">
    <span class="nav-icon">📁</span>
    <span class="nav-label">Файлы</span>
  </a>
  <a href="/prompts.html" class="active">
    <span class="nav-icon">🧠</span>
    <span class="nav-label">Промты</span>
  </a>
  <a href="/config.html">
    <span class="nav-icon">⚙</span>
    <span class="nav-label">Настройки</span>
  </a>
</nav>

<script src="js/base.js"></script>
<script src="js/api.js"></script>
<script src="js/editor.js"></script>
<script src="js/dropdown.js"></script>
<script>
'use strict';
(function() {
  const promptList = document.getElementById('promptList');
  const contentArea = document.getElementById('contentArea');
  const nameInput = document.getElementById('promptName');
  const dirtyIndicator = document.getElementById('dirtyIndicator');
  const statusDiv = document.getElementById('status');
  const saveBtn = document.getElementById('saveBtn');
  const selectBtn = document.getElementById('selectBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const createBtn = document.getElementById('createBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sidebar = document.getElementById('sidebar');
  const backToList = document.getElementById('backToList');
  const editorPanel = document.getElementById('editorPanel');

  const ed = new SidebarEditor({
    nameInput, contentArea, dirtyIndicator, statusDiv,
    saveBtn, deleteBtn,
    editorEl: document.querySelector('.editor .top').parentElement,
    emptyEl: null,
    actionsEl: document.querySelector('.actions')
  });

  // Override showEditor for fullscreen on mobile
  ed.showEditor = () => {
    document.querySelector('.editor .top').parentElement.style.display = 'flex';
    document.querySelector('.actions').style.display = 'flex';
    if (window.innerWidth <= 768) {
      editorPanel.classList.add('visible');
      sidebar.style.display = 'none';
    }
  };

  // Override hideEditor for fullscreen on mobile
  ed.hideEditor = () => {
    document.querySelector('.editor .top').parentElement.style.display = 'none';
    document.querySelector('.actions').style.display = 'none';
    ed.current = null;
    ed.originalName = '';
    ed.originalContent = '';
    nameInput.value = '';
    contentArea.value = '';
    dirtyIndicator.textContent = '';
    ed.isNew = false;
    if (window.innerWidth <= 768) {
      editorPanel.classList.remove('visible');
      sidebar.style.display = '';
    }
  };

  backToList.onclick = () => {
    if (ed.isDirty()) {
      if (!confirm('Есть несохранённые изменения. Продолжить?')) return;
    }
    ed.hideEditor();
  };

  async function fetchPrompts() {
    try {
      const data = await API.listPrompts();
      return data.prompts || [];
    } catch (e) {
      ed.showMsg('Не удалось загрузить список: ' + e.message, 'err');
      return [];
    }
  }

  async function renderList() {
    const names = await fetchPrompts();
    const active = sessionStorage.getItem('activePrompt');

    promptList.innerHTML = '';
    names.forEach(name => {
      const div = document.createElement('div');
      div.className = 'prompt-item' + (name === ed.current ? ' active' : '');
      div.textContent = name;
      if (name === active) {
        const star = document.createElement('span');
        star.className = 'badge';
        star.textContent = '\u25cf';
        star.style.color = 'var(--ok)';
        div.appendChild(star);
      }
      div.addEventListener('click', () => {
        if (ed.isDirty()) {
          if (!confirm('Есть несохранённые изменения. Перейти к другому файлу без сохранения?')) return;
        }
        loadPrompt(name);
      });
      promptList.appendChild(div);
    });
  }

  async function loadPrompt(name) {
    try {
      const data = await API.getPrompt(name);
      ed.load(name, data.content || '');
      ed.showEditor();
      document.querySelectorAll('.prompt-item').forEach(el => {
        el.classList.toggle('active', el.textContent.trim() === name);
      });
      await renderList();
    } catch (e) {
      ed.showMsg('Ошибка: ' + e.message, 'err');
      ed.load('', '');
      ed.showEditor();
    }
  }

  async function autoSelectAfterDelete() {
    const names = await fetchPrompts();
    if (names.length > 0) {
      loadPrompt(names[0]);
    }
  }

  ed.bindAll({
    saveFn: async (name, content) => {
      await API.savePrompt(name, content);
    },
    renameFn: async (oldName, newName) => {
      await API.renamePrompt(oldName, newName);
    },
    afterSave: renderList,
    deleteFn: async (name) => {
      await API.deletePrompt(name);
    },
    afterDelete: autoSelectAfterDelete
  });

  createBtn.addEventListener('click', () => {
    if (ed.isDirty()) {
      if (!confirm('Текущие изменения не сохранены. Продолжить?')) return;
    }
    ed.startNew();
  });

  resetBtn.addEventListener('click', () => {
    if (ed.current) {
      loadPrompt(ed.current);
    } else {
      ed.load('', '');
    }
  });

  selectBtn.addEventListener('click', async () => {
    if (!ed.current) { ed.showMsg('Сначала выберите промт', 'err'); return; }
    if (ed.isDirty()) {
      if (!confirm('Есть несохранённые изменения. Сохранить перед выбором?')) return;
      await ed.save({
        saveFn: async (name, content) => {
          await API.savePrompt(name, content);
        }
      });
    }
    try {
      await API.selectPrompt(ed.current);
      sessionStorage.setItem('activePrompt', ed.current);
      ed.showMsg('Промт "' + ed.current + '" теперь активен', 'ok');
      await renderList();
    } catch (e) { ed.showMsg('Ошибка: ' + e.message, 'err'); }
  });

  (async function init() {
    await renderList();
    const active = sessionStorage.getItem('activePrompt');
    const names = await fetchPrompts();
    if (active && names.includes(active)) {
      loadPrompt(active);
    } else if (names.length > 0) {
      loadPrompt(names[0]);
    }
  })();
})();
</script>
<script src="js/battery.js"></script>
</body>
</html>
