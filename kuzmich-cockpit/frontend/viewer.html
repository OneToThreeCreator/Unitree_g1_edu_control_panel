<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G1 Camera — LiveKit Viewer</title>
  <script src="https://unpkg.com/livekit-client@2/dist/livekit-client.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1418; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    .status { padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .status.connecting { background: #2a2a3e; color: #aaa; }
    .status.live { background: #1a3a1a; color: #4caf50; }
    .status.error { background: #3a1a1a; color: #f44336; }
    .status.offline { background: #2a2a2a; color: #888; }
    video { width: 100%; border-radius: 12px; background: #000; display: none; }
    .placeholder { width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: #1a1a2e; display: flex; align-items: center; justify-content: center; color: #555; font-size: 18px; }
    .controls { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #444; cursor: not-allowed; }
    button.disconnect { background: #dc2626; }
    button.disconnect:hover { background: #b91c1c; }
    .info { margin-top: 16px; padding: 12px; background: #1a1a2e; border-radius: 8px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>G1 Camera — LiveKit Viewer</h1>

    <div id="status" class="status offline">Ожидание...</div>

    <video id="video" autoplay playsinline></video>
    <div id="placeholder" class="placeholder">Нет видеопотока</div>

    <div class="controls">
      <button id="connectBtn" onclick="toggleConnection()">Подключить</button>
    </div>

    <div class="info">
      Сервер: <code id="serverUrl">ws://localhost:7880</code> ·
      Комната: <code>g1-camera</code> ·
      Токен: из бэкенда <code>/api/camera/livekit-token</code>
    </div>
  </div>

  <script src="js/livekit-viewer.js"></script>
  <script>
    const videoEl = document.getElementById('video');
    const placeholderEl = document.getElementById('placeholder');
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');

    let connected = false;

    function updateCamStatus(status) {
      statusEl.className = 'status ' + (status || 'offline');
      const labels = {
        'live': '● Live — видео получено',
        'connecting': '● Connecting...',
        'error': '● Error — ошибка подключения',
        'offline': '● Offline'
      };
      statusEl.textContent = labels[status] || labels['offline'];
    }

    async function toggleConnection() {
      if (connected) {
        disconnectLiveKit();
        connected = false;
        videoEl.style.display = 'none';
        placeholderEl.style.display = 'flex';
        connectBtn.textContent = 'Подключить';
        connectBtn.className = '';
        updateCamStatus('offline');
      } else {
        connectBtn.textContent = 'Подключение...';
        connectBtn.disabled = true;
        try {
          await connectLiveKit();
          connected = true;
          videoEl.style.display = 'block';
          placeholderEl.style.display = 'none';
          connectBtn.textContent = 'Отключить';
          connectBtn.className = 'disconnect';
        } catch (e) {
          console.error('[LK] Connect failed:', e);
          updateCamStatus('error');
          statusEl.textContent = '● Error — ' + e.message;
          connectBtn.textContent = 'Подключить';
        }
        connectBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
