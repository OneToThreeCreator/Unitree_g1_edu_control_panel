# Camera configuration — единый источник правды для Python + Rust
# Env vars перекрывают значения: CAM_GST_ENCODER=... → encoder.name

[color]
width = 1280
height = 720
fps = 30

[depth]
enabled = true
width = 640
height = 480
fps = 30

# GStreamer encoder name — определяет codec
[encoder_h265]
name = "nvv4l2h265enc"  # H.265 default. Fallback: nvv4l2h264enc, libx265
bitrate = 4000           # kbps

# H.264 fallback encoder (для браузеров без H.265)
[encoder_h264]
name = "nvv4l2h264enc"  # H.264 hardware encoder
bitrate = 6000           # kbps (нужно больше чем H.265 для同等质量)

# Fallback chain — пробует по порядку при старте
[[fallbacks]]
label = "USB 3.x full"
[color]
width = 1280
height = 720
fps = 30
[depth]
enabled = true
width = 640
height = 480
fps = 30

[[fallbacks]]
label = "USB 2.0 reduced"
[color]
width = 640
height = 480
fps = 15
[depth]
enabled = true
width = 640
height = 480
fps = 15

[[fallbacks]]
label = "USB 2.0 minimal"
[color]
width = 320
height = 240
fps = 15
[depth]
enabled = false

[webrtc]
stun_url = "stun:stun.l.google.com:19302"

# LiveKit SFU — WebRTC multi-viewer
[livekit]
url = "ws://127.0.0.1:7880"           # LiveKit WebSocket
api_key = "devkey"                     # API key
api_secret = "secret"                  # API secret
room = "g1-camera"                     # Room name
whip_url = "http://127.0.0.1:7880/whip/ingress/test"  # WHIP endpoint

# GStreamer WebSocket endpoints (сервятся GStreamer напрямую)
[websocket]
raw_bgr_port = 8082    # Raw BGR frames для YOLO
depth_port = 8083      # Raw depth Z16 для YOLO+3D (LOCAL mode only)
mjpeg_port = 8084      # MJPEG fallback (GStreamer jpegenc → websocketserver)

[teleop]
api_url = "http://192.168.1.102"
ws_url = "ws://192.168.1.102/ws/camera/preview"
codec = "h265"
poll_interval = 2.0
